<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" width="280" height="60">
  <!-- Minimalist Emblem -->
  <g transform="translate(10, 8)">
    <!-- Razor / Scissor abstract icon -->
    <rect x="0" y="0" width="44" height="44" rx="8" fill="#1e1e24" stroke="#c5a059" stroke-width="1.5" />
    <!-- Crossed minimalist blades -->
    <path d="M14 14L30 30M30 14L14 30" stroke="#c5a059" stroke-width="2" stroke-linecap="round" />
    <circle cx="22" cy="22" r="3" fill="#f4f4f6" />
    <!-- Subtle razor accents -->
    <line x1="22" y1="10" x2="22" y2="13" stroke="#c5a059" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="31" x2="22" y2="34" stroke="#c5a059" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Typographic Wordmark -->
  <g transform="translate(68, 32)">
    <text x="0" y="0" fill="#f4f4f6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="4">BARBER</text>
    <text x="0" y="16" fill="#c5a059" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="5">HIGH-END STUDIO</text>
  </g>
</svg>
